o",d:"Ao receber, emita o recibo numerado com o logotipo da empresa e salve em PDF. Pelo WhatsApp, só depois de conferir o número do destinatário. O recibo não é documento fiscal."}],acao:{rotulo:"Abrir A pagar e receber",fazer:()=>xa({id:"planejamento"})}},{id:"atalho",titulo:"Atalho no computador e no celular",resumo:"O ícone amarelo para abrir com um toque.",passos:[{t:"No computador",d:"No Chrome ou no Edge, use Criar atalho (em Primeiros passos ou no rodapé do menu). O Obrativa ganha o ícone na área de trabalho e no menu Iniciar e abre em janela própria."},{t:"No iPhone ou iPad",d:"No Safari, toque em Compartilhar (o quadrado com a seta para cima) › Adicionar à Tela de Início › Adicionar."},{t:"No Android",d:"No Chrome, toque em ⋮ › Instalar app (ou Adicionar à tela inicial) › Instalar."},{t:"Na nuvem, os dados vão junto",d:"Entrando com o mesmo login, o celular e o computador mostram os mesmos dados. O rodapé do menu diz quando tudo foi salvo na nuvem."}],acao:{rotulo:"Criar o atalho",fazer:()=>ja({id:"atalho"})}},{id:"empresas",titulo:"Várias empresas e obras arquivadas",resumo:"Cada CNPJ com seus dados; obras antigas fora do caminho.",passos:[{t:"Uma empresa por CNPJ (plano Completo)",d:"Em Configurações › Empresa, cadastre outra empresa com razão social, nome de exibição e CNPJ. Ela começa vazia, com fluxos, obras, categorias e relatórios só dela."},{t:"Troque pelo cabeçalho",d:"O nome da empresa aberta fica no alto da tela. Clique nele para trocar, sem sair do app. Com mais de uma empresa, o app começa pela tela de escolha."},{t:"Nada se mistura",d:"Saldos, lançamentos e relatórios são sempre de uma empresa só. Cadastrar uma empresa nova não altera as outras. O backup é da empresa aberta."},{t:"Concluir e arquivar uma obra (planos Gestão e Completo)",d:"Concluir tira a obra dos rateios novos; ela continua aceitando recebimentos e despesas, por exemplo na garantia. Encerradas as pendências, use Arquivar obra: ela sai das listas de trabalho e fica em Obras ›     <script>
      // Barra da abertura: enche de 0 a 100% em 1,5 s, contando a partir do primeiro quadro que aparece na tela
      (function () {
        var barra = document.querySelector('#abertura .carga i'), t0 = 0, DUR = 1500
        function suave(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
        function quadro(t) {
          if (!t0) t0 = t
          var k = Math.min(1, (t - t0) / DUR)
          barra.style.transform = 'scaleX(' + suave(k) + ')'
          if (k < 1) requestAnimationFrame(quadro)
        }
        requestAnimationFrame(quadro)
        window.aberturaPronta = function () { return t0 > 0 && performance.now() - t0 >= DUR + 80 }
      })()
    </script>
